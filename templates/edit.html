{% extends 'base.html' %}{% block title %}Editar lançamento | Finanças em Dia{% endblock %}{% block content %}<div class="edit-wrap"><a class="back" href="{{ url_for('index', month=transaction.transaction_date[:7]) }}">← Voltar para o painel</a><section class="panel"><div class="eyebrow">AJUSTE SEUS REGISTROS</div><h1>Editar <em>lançamento.</em></h1><p class="subtle">Atualize as informações abaixo e salve as alterações.</p><form method="post" class="entry-form edit-form"><label>Descrição<input name="description" maxlength="100" value="{{ transaction.description }}" required></label><label>Tipo<select name="kind"><option value="despesa" {% if transaction.kind == 'despesa' %}selected{% endif %}>Despesa</option><option value="receita" {% if transaction.kind == 'receita' %}selected{% endif %}>Receita</option></select></label><label>Categoria<select name="category">{% for item in categories %}<option {% if item == transaction.category %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label><label>Valor (R$)<input name="amount" type="number" min="0.01" step="0.01" max="999999999.99" value="{{ '%.2f'|format(transaction.amount_cents / 100) }}" required></label><label>Data<input name="transaction_date" type="date" value="{{ transaction.transaction_date }}" required></label><button class="button primary" type="submit">Salvar alterações ↗</button></form></section></div>{% endblock %}
